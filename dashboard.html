<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — QuarkVPN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-muted: #8e95a5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 8%; border-bottom: 1px solid var(--card-border);
    }

    .logo { display: flex; align-items: center; gap: 12px; font-size: 1.3rem; font-weight: 700; color: #fff; text-decoration: none; }
    .logo-icon { width: 34px; height: 34px; background: #fff; color: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; }

    .dashboard-container { max-width: 1000px; margin: 40px auto; padding: 0 8%; width: 100%; flex: 1; }
    .section-title { font-size: 2rem; margin-bottom: 30px; }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 32px; margin-bottom: 24px; }
    .card h3 { font-size: 1.25rem; margin-bottom: 12px; }

    .btn { padding: 10px 24px; border-radius: 30px; text-decoration: none; font-weight: 600; display: inline-block; cursor: pointer; border: none; font-size: 0.95rem; transition: 0.3s; }
    .btn-primary { background: #fff; color: #000; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outline { border: 1px solid var(--card-border); color: #fff; background: transparent; }
    .btn-outline:hover { background: rgba(255,255,255,0.05); }
    .btn-danger { background: rgba(255, 80, 80, 0.1); border: 1px solid rgba(255, 80, 80, 0.3); color: #ff6b6b; }

    .badge { display: inline-block; padding: 6px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); border-radius: 20px; font-size: 0.85rem; color: var(--text-muted); }
    
    .device-list { list-style: none; margin-top: 20px; }
    .device-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); border: 1px solid var(--card-border); padding: 16px 24px; border-radius: 12px; margin-bottom: 12px; }

    #toast {
      position: fixed; bottom: 30px; right: 30px; background: #ffffff; color: #000;
      padding: 16px 24px; border-radius: 12px; font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateY(150px); transition: transform 0.3s ease; z-index: 1100;
    }
    #toast.show { transform: translateY(0); }

    footer { border-top: 1px solid var(--card-border); padding: 30px 8%; text-align: center; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <div class="logo-icon">Q</div>
      <span>QuarkVPN</span>
    </a>
    <a href="index.html" class="btn btn-outline">← На главную</a>
  </header>

  <div class="dashboard-container">
    <h2 class="section-title" id="welcome-user">Личный кабинет</h2>

    <!-- Блок подписки -->
    <div class="card" id="subscription-card">
      <!-- Динамически заполнится JS -->
    </div>

    <!-- Учетная запись -->
    <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
      <div>
        <h3>Учетная запись</h3>
        <p style="color: var(--text-muted); margin-top: 4px;" id="account-email">email@example.com</p>
      </div>
      <button class="btn btn-danger" onclick="logout()">Выйти из аккаунта</button>
    </div>

    <!-- Устройства -->
    <div class="card" id="devices-section" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3>Подключенные устройства (<span id="device-count">0</span>/<span id="device-max">3</span>)</h3>
        <button class="btn btn-primary" onclick="addDevice()">+ Подключить устройство</button>
      </div>
      <ul class="device-list" id="device-list"></ul>
    </div>
  </div>

  <div id="toast">Успешно!</div>

  <footer>
    <p>© 2026 QuarkVPN. Все права защищены.</p>
  </footer>

  <script>
    let usersDB = JSON.parse(localStorage.getItem('quark_users_db')) || {};
    let currentEmail = localStorage.getItem('quark_current_user');

    if (!currentEmail || !usersDB[currentEmail]) {
      window.location.href = 'index.html';
    } else {
      initDashboard();
    }

    function initDashboard() {
      const user = usersDB[currentEmail];
      document.getElementById('welcome-user').textContent = `Личный кабинет: ${user.email}`;
      document.getElementById('account-email').textContent = user.email;

      renderSubscription(user);
    }

    function renderSubscription(user) {
      const subCard = document.getElementById('subscription-card');
      const devicesSection = document.getElementById('devices-section');

      if (!user.subscription || !user.subscription.active) {
        subCard.innerHTML = `
          <div style="text-align: center; padding: 10px 0;">
            <h3 style="margin-bottom: 10px; color: #ff6b6b;">Активная подписка отсутствует</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Для подключения устройств и доступа к сети выберите тариф.</p>
            <a href="index.html#pricing" class="btn btn-primary">Выбрать тариф</a>
          </div>
        `;
        devicesSection.style.display = 'none';
      } else {
        subCard.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
            <div>
              <span class="badge" style="color: #4cd137; border-color: rgba(76,209,55,0.3); margin-bottom: 8px;">Подписка активна</span>
              <h3>${user.subscription.name}</h3>
              <p style="color: var(--text-muted); margin-top: 4px;">Лимит устройств: ${user.subscription.limit}</p>
            </div>
            <a href="index.html#pricing" class="btn btn-outline">Продлить / Сменить тариф</a>
          </div>
        `;
        devicesSection.style.display = 'block';
        renderDevices(user);
      }
    }

    function renderDevices(user) {
      const listEl = document.getElementById('device-list');
      document.getElementById('device-count').textContent = user.devices.length;
      document.getElementById('device-max').textContent = user.subscription.limit;

      if (user.devices.length === 0) {
        listEl.innerHTML = `<li style="color: var(--text-muted); text-align: center; padding: 20px;">Устройства не подключены</li>`;
        return;
      }

      listEl.innerHTML = user.devices.map((dev, index) => `
        <li class="device-item">
          <div>
            <strong>${dev.name}</strong>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Добавлено: ${dev.added}</p>
          </div>
          <button class="btn btn-danger" style="padding: 6px 14px; font-size: 0.85rem;" onclick="removeDevice(${index})">Отвязать</button>
        </li>
      `).join('');
    }

    function addDevice() {
      const user = usersDB[currentEmail];
      if (user.devices.length >= user.subscription.limit) {
        showToast('Достигнут лимит устройств!');
        return;
      }

      const deviceNames = ['Смартфон (iOS / Android)', 'Ноутбук (Windows / Mac)', 'Планшет', 'Роутер'];
      user.devices.push({ name: deviceNames[user.devices.length % deviceNames.length], added: 'Только что' });
      
      localStorage.setItem('quark_users_db', JSON.stringify(usersDB));
      renderDevices(user);
      showToast('Устройство подключено!');
    }

    function removeDevice(index) {
      const user = usersDB[currentEmail];
      user.devices.splice(index, 1);
      localStorage.setItem('quark_users_db', JSON.stringify(usersDB));
      renderDevices(user);
      showToast('Устройство отвязано');
    }

    function logout() {
      localStorage.removeItem('quark_current_user');
      window.location.href = 'index.html';
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }
  </script>
</body>
</html>
