<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuarkVPN — Абсолютная приватность и скорость</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script>document.documentElement.className += ' js';</script>
  <style>
    :root {
      --bg: #07080b;
      --panel: #0d0f15;
      --panel-2: #10131a;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --text: #edeff3;
      --muted: #8b93a5;
      --accent: #c8ff4d;
      --accent-ink: #0a0c10;
      --danger: #ff8585;
      --font-head: 'Space Grotesk', 'Inter', sans-serif;
      --font-text: 'Inter', sans-serif;
      --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
      --radius: 16px;
      --radius-lg: 24px;
      --z-header: 100;
      --z-mobile-menu: 90;
      --z-modal: 1000;
      --z-toast: 1100;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html { scroll-behavior: smooth; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-text);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Тонкая сетка-подложка «лаборатории» */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, #000 30%, transparent 75%);
      mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, #000 30%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ===== Появление при скролле ===== */
    .js .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out);
      transition-delay: var(--reveal-delay, 0ms);
    }
    .js .reveal.is-visible {
      opacity: 1;
      transform: none;
    }

    @keyframes vb-q7x-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(200, 255, 77, 0.5); }
      50% { box-shadow: 0 0 0 6px rgba(200, 255, 77, 0); }
    }

    /* ===== Хедер ===== */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 6%;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 8, 11, 0.8);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: var(--z-header);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-head);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .logo:hover { opacity: 0.8; }

    .logo-icon {
      width: 30px;
      height: 30px;
      background: var(--accent);
      color: var(--accent-ink);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .site-nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 8px 14px;
      font-size: 0.92rem;
      font-weight: 500;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
    }

    .site-nav a:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .btn {
      padding: 11px 22px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      transition: transform 0.25s var(--ease-out), background 0.2s, border-color 0.2s, box-shadow 0.25s;
      display: inline-block;
      cursor: pointer;
      border: none;
      text-align: center;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(200, 255, 77, 0.25);
    }

    .btn-outline {
      border: 1px solid var(--line-strong);
      color: var(--text);
      background: transparent;
    }

    .btn-outline:hover {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.04);
    }

    .btn-ghost {
      color: var(--text);
      background: transparent;
      border: 1px solid transparent;
    }

    .btn-ghost:hover { color: var(--accent); }

    .auth-buttons-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .user-email {
      color: var(--muted);
      font-size: 0.82rem;
      font-family: var(--font-mono);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Бургер */
    .burger {
      display: none;
      background: none;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      width: 42px;
      height: 42px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .burger span,
    .burger span::before,
    .burger span::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: transform 0.3s var(--ease-out), opacity 0.2s;
    }

    .burger span { top: 50%; margin-top: -1px; }
    .burger span::before { top: -6px; left: 0; transform: none; }
    .burger span::after { top: 6px; left: 0; transform: none; }

    .site-header.menu-open .burger span { background: transparent; }
    .site-header.menu-open .burger span::before { transform: translateY(6px) rotate(45deg); }
    .site-header.menu-open .burger span::after { transform: translateY(-6px) rotate(-45deg); }

    /* ===== Герой ===== */
    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 56px;
      padding: 88px 6% 72px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -60px;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(200, 255, 77, 0.07) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 28px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: vb-q7x-pulse 2.4s infinite;
    }

    .hero h1 {
      font-family: var(--font-head);
      font-size: clamp(2.3rem, 5.4vw, 3.9rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 22px;
      text-wrap: balance;
    }

    .hero h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .hero-lead {
      color: var(--muted);
      font-size: 1.1rem;
      margin-bottom: 34px;
      max-width: 52ch;
    }

    .hero-cta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Панель-консоль с Лисом */
    .hero-panel {
      background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }

    .hero-panel__bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .hero-panel__img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .hero-panel__rows {
      padding: 18px;
      display: grid;
      gap: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .stat-row dt { color: var(--muted); }
    .stat-row dd { color: var(--text); }
    .stat-row dd.ok { color: var(--accent); }

    /* ===== Секции ===== */
    .section {
      position: relative;
      max-width: 1280px;
      margin: 0 auto;
      padding: 72px 6%;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .section-head h2 {
      font-family: var(--font-head);
      font-size: clamp(1.7rem, 3.6vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      text-wrap: balance;
    }

    .section-head p {
      color: var(--muted);
      font-size: 0.98rem;
      max-width: 42ch;
    }

    .kicker {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* ===== Возможности: асимметричная сетка ===== */
    .features-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      grid-template-rows: auto auto;
      gap: 20px;
    }

    .feat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px;
      transition: border-color 0.3s ease, transform 0.3s var(--ease-out);
    }

    .feat:hover {
      border-color: var(--line-strong);
      transform: translateY(-4px);
    }

    .feat--lead {
      grid-row: span 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 28px;
      background:
        radial-gradient(circle at 85% 15%, rgba(200, 255, 77, 0.08) 0%, transparent 55%),
        var(--panel);
    }

    .feat__icon {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      margin-bottom: 18px;
      background: rgba(255, 255, 255, 0.03);
    }

    .feat h3 {
      font-family: var(--font-head);
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .feat p {
      color: var(--muted);
      font-size: 0.93rem;
      max-width: 46ch;
    }

    .feat__metric {
      font-family: var(--font-head);
      font-size: clamp(3rem, 7vw, 4.6rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .feat__metric span {
      font-size: 1.1rem;
      color: var(--muted);
      font-family: var(--font-mono);
      font-weight: 400;
      letter-spacing: 0;
    }

    /* ===== Тарифы ===== */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      align-items: stretch;
    }

    .pricing-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s var(--ease-out), border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .pricing-card:hover {
      transform: translateY(-6px);
      border-color: var(--line-strong);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }

    .pricing-card:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200, 255, 77, 0.2);
    }

    .pricing-card--featured {
      border-color: rgba(200, 255, 77, 0.45);
      background:
        radial-gradient(circle at 50% 0%, rgba(200, 255, 77, 0.08) 0%, transparent 60%),
        var(--panel);
    }

    .plan-tag {
      position: absolute;
      top: -12px;
      left: 28px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 0.72rem;
      font-weight: 700;
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 999px;
    }

    .plan-name {
      font-family: var(--font-head);
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .plan-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--line-strong);
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.2s;
    }

    .plan-radio::after {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .pricing-card:hover .plan-radio,
    .pricing-card--featured .plan-radio {
      border-color: var(--accent);
    }

    .pricing-card--featured .plan-radio::after { opacity: 1; }

    .plan-price {
      font-family: var(--font-head);
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 4px;
    }

    .plan-price small {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: var(--font-mono);
      font-weight: 400;
      letter-spacing: 0;
    }

    .plan-note {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .plan-features {
      list-style: none;
      display: grid;
      gap: 10px;
      margin-bottom: 26px;
      flex: 1;
    }

    .plan-features li {
      color: var(--muted);
      font-size: 0.9rem;
      display: flex;
      gap: 10px;
      align-items: baseline;
    }

    .plan-features li::before {
      content: '→';
      color: var(--accent);
      font-family: var(--font-mono);
      flex-shrink: 0;
    }

    .pricing-card .btn { width: 100%; }

    .pricing-card .btn-outline {
      background: rgba(255, 255, 255, 0.03);
    }

    .pricing-mascot {
      margin-top: 40px;
      display: flex;
      align-items: center;
      gap: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 22px;
    }

    .pricing-mascot img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: var(--radius);
      flex-shrink: 0;
    }

    .pricing-mascot p {
      color: var(--muted);
      font-size: 1rem;
    }

    .pricing-mascot p strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ===== Поддержка с Барсуком ===== */
    .support-card {
      display: flex;
      align-items: center;
      gap: 30px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 26px;
      margin-bottom: 28px;
    }

    .support-card img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: var(--radius);
      flex-shrink: 0;
    }

    .support-card__body { flex: 1; text-align: left; }

    .support-card__body p {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 16px;
      max-width: 46ch;
    }

    .support-hours {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--accent);
      border: 1px solid rgba(200, 255, 77, 0.3);
      border-radius: 999px;
      padding: 5px 12px;
    }

    .telegram-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #229ed9;
      color: #fff;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.25s var(--ease-out), background 0.3s ease;
      box-shadow: 0 0 20px rgba(34, 158, 217, 0.3);
    }

    .telegram-btn:hover {
      transform: translateY(-2px);
      background: #1f8bc2;
    }

    .support-wrap {
      text-align: center;
      max-width: 900px;
    }

    /* ===== Модалка ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 8, 11, 0.82);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: var(--z-modal);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--panel-2);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      transform: translateY(14px);
      transition: transform 0.3s var(--ease-out);
    }

    .modal-overlay.active .modal { transform: translateY(0); }

    .modal h2 {
      font-family: var(--font-head);
      margin-bottom: 8px;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }

    .modal-subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      color: #d3d7e0;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .form-hint {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-family: var(--font-mono);
      margin-top: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control::placeholder { color: #626a7a; }

    .form-control:focus {
      border-color: rgba(200, 255, 77, 0.55);
      box-shadow: 0 0 0 3px rgba(200, 255, 77, 0.12);
    }

    .form-control[aria-invalid="true"] {
      border-color: rgba(255, 99, 99, 0.65);
    }

    .form-error {
      display: none;
      color: var(--danger);
      font-size: 0.82rem;
      margin-top: 8px;
    }

    .form-error.visible { display: block; }

    .close-modal {
      position: absolute;
      top: 18px;
      right: 18px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      transition: color 0.2s, background 0.2s;
    }

    .close-modal:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .switch-auth-text {
      text-align: center;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .switch-auth-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.88rem;
      font-family: inherit;
      padding: 0;
    }

    /* ===== Тост ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--accent);
      color: var(--accent-ink);
      padding: 15px 22px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      transform: translateY(160px);
      transition: transform 0.35s var(--ease-out);
      z-index: var(--z-toast);
      max-width: min(340px, calc(100vw - 60px));
    }

    .toast.show { transform: translateY(0); }

    /* ===== Футер ===== */
    .site-footer {
      border-top: 1px solid var(--line);
      padding: 36px 6%;
      display: flex;
