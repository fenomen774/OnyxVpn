<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuarkVPN — Абсолютная приватность и скорость</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #ffffff;
      --text-muted: #8e95a5;
      --gradient-silver: linear-gradient(135deg, #ffffff 0%, #a6afb8 50%, #4b5563 100%);
      --glow: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: #fff;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .bg-glow {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(160, 175, 200, 0.12) 0%, rgba(9, 10, 15, 0) 70%);
      z-index: -1;
      filter: blur(80px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 8%;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .logo:hover {
      opacity: 0.85;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: #fff;
      color: #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin: 0 16px;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #fff;
    }

    .btn {
      padding: 10px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      display: inline-block;
      cursor: pointer;
      border: none;
      text-align: center;
    }

    .btn-primary {
      background: #fff;
      color: #000;
      box-shadow: 0 0 20px var(--glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    }

    .btn-outline {
      border: 1px solid var(--card-border);
      color: #fff;
      background: var(--card-bg);
    }

    .auth-buttons-group {
      display: flex;
      gap: 10px;
    }

    /* Главный экран с Лисом */
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 80px 8%;
      max-width: 1300px;
      margin: 0 auto;
      gap: 50px;
    }

    .hero-content {
      flex: 1.2;
    }

    .hero-visual {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    /* Карточка маскота */
    .mascot-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .mascot-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 18px;
    }

    .speech-bubble {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 1rem;
      color: var(--text-muted);
    }

    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 3.2rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 24px;
      background: var(--gradient-silver);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.15rem;
      margin-bottom: 36px;
    }

    .features {
      padding: 80px 8%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 50px;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    /* Тарифы с Хорьком */
    .pricing-with-mascot {
      display: flex;
      align-items: center;
      gap: 40px;
      max-width: 1300px;
      margin: 0 auto;
      padding: 80px 8%;
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      flex: 2.5;
    }

    .pricing-mascot-side {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .card-icon {
      font-size: 2rem;
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 1.25rem;
      margin-bottom: 12px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .pricing-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.35s ease, 
                  box-shadow 0.35s ease, 
                  background 0.35s ease;
    }

    .pricing-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.02) 100%);
    }

    .pricing-card.featured {
      border-color: rgba(255, 255, 255, 0.3);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
    }

    .pricing-price {
      font-size: 2.4rem;
      font-weight: 800;
      margin: 20px 0;
    }

    .pricing-price span {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .pricing-features {
      list-style: none;
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .pricing-features li {
      margin-bottom: 10px;
    }

    /* Поддержка с широкой горизонтальной карточкой Барсука (крупная картинка) */
    .support-section {
      text-align: center;
      padding: 60px 8% 100px;
      max-width: 850px;
      margin: 0 auto;
    }

    .support-card {
      display: flex;
      align-items: center;
      gap: 30px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 30px;
      text-align: left;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      margin-bottom: 30px;
    }

    /* Увеличили размер картинки барсука до 260px в ширину */
    .support-card img {
      width: 260px;
      height: 260px;
      object-fit: cover;
      border-radius: 16px;
      flex-shrink: 0;
    }

    .telegram-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #229ed9;
      color: #fff;
      padding: 14px 36px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      box-shadow: 0 0 20px rgba(34, 158, 217, 0.4);
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .telegram-btn:hover {
      transform: translateY(-2px);
      background: #1f8bc2;
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 10, 15, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

      background: #12
